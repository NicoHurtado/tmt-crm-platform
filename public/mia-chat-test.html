<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mía — Chat de Prueba · TMT Travel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 420px;
      height: 680px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    /* Header */
    .chat-header {
      background: #111;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D6A75D, #F2C94C);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { color: #fff; font-weight: 600; font-size: 15px; }
    .header-status { color: #D6A75D; font-size: 12px; margin-top: 2px; }
    .badge {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, #D6A75D, #c49040);
      color: #000;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #252525;
      color: #e8e8e8;
      border-bottom-left-radius: 4px;
      border: 1px solid #333;
    }

    .msg-time {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing { display: none; align-self: flex-start; }
    .typing.visible { display: flex; }
    .typing .bubble {
      background: #252525;
      border: 1px solid #333;
      padding: 12px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: #D6A75D;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 12px 16px;
      background: #111;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 100px;
      min-height: 42px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #D6A75D; }
    textarea::placeholder { color: #555; }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #D6A75D, #c49040);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { fill: #000; }

    /* Session info */
    .session-bar {
      padding: 6px 16px;
      background: #0e0e0e;
      border-top: 1px solid #222;
      font-size: 10px;
      color: #444;
      display: flex;
      justify-content: space-between;
    }
    .session-bar span { color: #666; }

    /* Error toast */
    .error-toast {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 999;
    }
    .error-toast.show { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; top: 10px; } to { opacity: 1; top: 20px; } }
  </style>
</head>
<body>

<div class="error-toast" id="errorToast"></div>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🌟</div>
    <div class="header-info">
      <div class="header-name">Mía</div>
      <div class="header-status">● En línea · TMT Travel</div>
    </div>
    <div class="badge">PRUEBA</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="bubble">¡Hola! Soy Mía, tu asistente virtual de TMT Travel 👋
¿En qué puedo ayudarte hoy?</div>
      <div class="msg-time">ahora</div>
    </div>
  </div>

  <div class="typing" id="typing">
    <div class="bubble">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="input"
      placeholder="Escribe tu mensaje..."
      rows="1"
      autofocus
    ></textarea>
    <button class="send-btn" id="sendBtn" title="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="session-bar">
    <span>Session: <span id="sessionDisplay">—</span></span>
    <span id="msgCount">0 mensajes</span>
  </div>
</div>

<script>
  const WEBHOOK_URL = 'http://localhost:3000/api/chat-test';
  const sessionId = 'chat-' + Math.random().toString(36).substring(2, 10);

  let msgCount = 0;
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const typingEl = document.getElementById('typing');
  const sessionDisplay = document.getElementById('sessionDisplay');
  const msgCountEl = document.getElementById('msgCount');
  const errorToast = document.getElementById('errorToast');

  sessionDisplay.textContent = sessionId;

  function getTime() {
    return new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="bubble">${text}</div>
      <div class="msg-time">${getTime()}</div>
    `;
    messagesEl.insertBefore(div, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    msgCount++;
    msgCountEl.textContent = `${msgCount} mensaje${msgCount !== 1 ? 's' : ''}`;
    return div;
  }

  function showTyping() {
    typingEl.classList.add('visible');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    typingEl.classList.remove('visible');
  }

  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.classList.add('show');
    setTimeout(() => errorToast.classList.remove('show'), 4000);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage(text, 'user');
    showTyping();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId })
      });

      if (!res.ok) throw new Error(`Error ${res.status}`);

      const data = await res.json();
      hideTyping();
      addMessage(data.response || '(sin respuesta)', 'bot');
    } catch (err) {
      hideTyping();
      showError('Error al conectar con Mía. Revisa la consola.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  });

  // Send on Enter (Shift+Enter for new line)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
</script>

</body>
</html>
